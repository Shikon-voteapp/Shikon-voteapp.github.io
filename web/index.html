  <style>
    :root { --bg: #ffffff; --fg: #000000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #ffffff; }
    }
    .loading-container {
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 12px 16px;
      font-family: 'Noto Sans JP', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', sans-serif;
      z-index: 9999;
    }
    .loading-text { font-size: 14px; opacity: 0.85; }
  </style>

  <script>
    // Flutterの最初のフレームが描画されたらローダーをフェードアウトして削除
    // フォント読み込み完了までローダーを保持し、豆腐出現を抑止
    let fontLoaded = false;
    let flutterFirstFrame = false;

    function maybeHide() {
      if (fontLoaded && flutterFirstFrame) {
        var loadingElement = document.getElementById('loading');
        if (!loadingElement) return;
        loadingElement.style.transition = 'opacity 350ms ease';
        loadingElement.style.opacity = '0';
        setTimeout(function(){
          if (loadingElement && loadingElement.parentNode) {
            loadingElement.parentNode.removeChild(loadingElement);
          }
        }, 380);
      }
    }

    // Noto Sans JP がロードされたらフラグON
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function(){
        fontLoaded = true;
        maybeHide();
      });
    } else {
      // フォントAPI非対応ブラウザはタイムアウトでフォールバック（2.2秒）
      setTimeout(function(){ fontLoaded = true; maybeHide(); }, 2200);
    }

    window.addEventListener('flutter-first-frame', function () {
      flutterFirstFrame = true;
      maybeHide();
    });

    // 互換: Flutter側から明示的に呼ばれる場合も同様に処理
    function flutterReady() {
      var event = new Event('flutter-first-frame');
      window.dispatchEvent(event);
    }
  </script>
</head>
<body style="background-color: var(--bg); color: var(--fg);">

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

name: shikon_voteapp
description: "A flutter project that provides voting service on the Shikon Fes."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.5.2+13
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  uuid: ^4.5.1
  shared_preferences: ^2.1.1
  mobile_scanner: any
  flutter_svg: ^2.0.5
  intl: ^0.20.2
  provider: ^6.0.5
  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  fl_chart: ^1.1.0
  collection: ^1.19.1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  firebase_database: any
  connectivity_plus: ^7.0.0
  firebase_data_connect: ^0.2.0+2
  excel: ^4.0.6
  csv: ^6.0.0
  share_plus: ^12.0.0
  google_sign_in: any
  flutter_facebook_auth: any
  twitter_login: any
  camera: ^0.11.2
  path_provider: ^2.1.1
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.2
  file_picker: ^10.3.3
  package_info_plus: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_neumorphic_plus: ^3.3.0
  flutter_staggered_animations: ^1.1.1
  web: ^1.1.0
  icons_plus: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: A-OTF-ShinGoPr6
      fonts:
        - asset: assets/Fonts/A-OTF-ShinGoPr6-Light.otf
          weight: 300
        - asset: assets/Fonts/A-OTF-ShinGoPr6-Regular.otf
          weight: 400
        - asset: assets/Fonts/A-OTF-ShinGoPr6-Medium.otf
          weight: 500
        - asset: assets/Fonts/A-OTF-ShinGoPr6-Bold.otf
          weight: 700
    - family: Triumvirate
      fonts:
        - asset: assets/Fonts/Triumvirate.ttf
          weight: 400
        - asset: assets/Fonts/Triumvirate.ttf
          weight: 500
        - asset: assets/Fonts/Triumvirate Bold.ttf
          weight: 600
        - asset: assets/Fonts/Triumvirate Bold.ttf
          weight: 700